version: '3.8'

services:
  estacionamento:
    build:
      context: ./service
      dockerfile: Dockerfile

    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/estacionamento_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    depends_on:
      - db
    networks:
      - estac-net

  pagamento:
    build:
       context: ./pagamento
       dockerfile: Dockerfile
    ports:
      - "8088:8088"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/pagamento
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    depends_on:
      - db

  db:
    image: postgres:13
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_MULTIPLE_DATABASES=estacionamento_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  discovery:
    build:
      context: ./discovery
      dockerfile: Dockerfile
    ports:
     - "8761:8761"
    container_name: discovery
    networks:
      - estac-net

volumes:
  postgres_data:

networks:
  estac-net:
    driver: bridge



